<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Vegan Meal Planning Hub</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f0fdf4;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #16a34a;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.125rem;
            max-width: 500px;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        a {
            display: inline-block;
            background-color: #16a34a;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        a:hover {
            background-color: #15803d;
        }
    </style>
</head>
<body>
    <h1>You are offline</h1>
    <p>Don't worry! Your cached plans, recipes, and meal progress are still available.</p>
    <a href="/">Go to App</a>
</body>
</html>
